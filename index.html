<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
  <title>RepRise — Workout Planner</title>
  <meta name="description" content="Browse exercises by muscle group, watch animated demos, and build &amp; save your own workout plans. Installable offline PWA." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RepRise" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="brand">
        <svg class="brand-logo" viewBox="0 0 48 48" aria-hidden="true">
          <use href="icons/icon.svg#logo" />
        </svg>
        <div class="brand-text">
          <h1>RepRise</h1>
          <span class="tagline">Plan • Train • Progress</span>
        </div>
      </div>
      <button id="installBtn" class="install-btn" hidden>Install app</button>
    </header>

    <main id="view" class="view"><!-- rendered by app.js --></main>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-view="browse">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span>Browse</span>
      </button>
      <button class="tab" data-view="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>My Plan</span>
        <em id="planCount" class="tab-badge" hidden>0</em>
      </button>
    </nav>
  </div>

  <!-- Exercise detail modal -->
  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script src="js/exercises.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function (e) {
          console.warn('SW registration failed', e);
        });
      });
    }
  </script>
</body>
</html>
