<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout Buddy" />
    <title>Workout Buddy</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Workout Buddy home">
          <img src="assets/logo.svg" alt="" />
          <span>Workout Buddy</span>
        </a>
        <button class="ghost-button" id="clearPlanButton" type="button" aria-label="Clear saved plan">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M8 6V4h8v2" />
            <path d="M19 6l-1 14H6L5 6" />
            <path d="M10 11v5" />
            <path d="M14 11v5" />
          </svg>
          <span>Reset</span>
        </button>
      </header>

      <main>
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <p class="eyebrow">Choose a muscle group</p>
            <h1 id="hero-title">Find your next workout fast.</h1>
            <p>
              Pick a body area, filter the list, and build a quick plan you can keep everywhere.
            </p>
          </div>
          <div class="hero-art" aria-hidden="true">
            <img src="assets/workout-figure.svg" alt="" />
          </div>
        </section>

        <section class="controls" aria-label="Workout controls">
          <label class="search-wrap" for="searchInput">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input id="searchInput" type="search" placeholder="Search exercises, equipment, or goal" />
          </label>

          <div class="filter-row" aria-label="Workout filters">
            <button class="chip active" type="button" data-filter="all">All</button>
            <button class="chip" type="button" data-filter="bodyweight">Bodyweight</button>
            <button class="chip" type="button" data-filter="dumbbells">Dumbbells</button>
            <button class="chip" type="button" data-filter="gym">Gym</button>
            <button class="chip" type="button" data-filter="beginner">Beginner</button>
          </div>
        </section>

        <section class="layout-grid">
          <aside class="muscle-panel" aria-label="Muscle groups">
            <div class="panel-heading">
              <h2>Muscle Groups</h2>
              <span id="groupCount">12</span>
            </div>
            <div class="muscle-list" id="muscleList"></div>
          </aside>

          <section class="workout-panel" aria-live="polite">
            <div class="section-heading">
              <div>
                <p class="eyebrow" id="selectedGroupLabel">Chest</p>
                <h2 id="selectedGroupTitle">Chest Workouts</h2>
              </div>
              <span class="result-pill" id="resultCount">0 moves</span>
            </div>
            <div class="workout-grid" id="workoutGrid"></div>
          </section>

          <aside class="plan-panel" aria-label="Saved workout plan">
            <div class="panel-heading">
              <h2>My Plan</h2>
              <div class="plan-heading-actions">
                <span id="planCount">0</span>
                <button class="expand-plan-button" id="expandPlanButton" type="button" aria-expanded="false" aria-label="Expand My Plan">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M8 3H3v5" />
                    <path d="M3 3l7 7" />
                    <path d="M16 3h5v5" />
                    <path d="M21 3l-7 7" />
                    <path d="M8 21H3v-5" />
                    <path d="M3 21l7-7" />
                    <path d="M16 21h5v-5" />
                    <path d="M21 21l-7-7" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="plan-list" id="planList"></div>
          </aside>
        </section>
      </main>
    </div>

    <div class="plan-zoom" id="planZoom" aria-hidden="true">
      <div class="plan-zoom-card" role="dialog" aria-modal="true" aria-labelledby="planZoomTitle">
        <div class="plan-zoom-heading">
          <h2 id="planZoomTitle">My Plan</h2>
          <div class="plan-heading-actions">
            <span id="planZoomCount">0</span>
            <button class="modal-close" id="planZoomCloseButton" type="button" aria-label="Close expanded My Plan">x</button>
          </div>
        </div>
        <div class="plan-list plan-zoom-list" id="planZoomList"></div>
      </div>
    </div>

    <div class="plan-modal" id="planModal" aria-hidden="true">
      <div class="plan-modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalCloseButton" type="button" aria-label="Close full screen workout view">x</button>
        <p class="eyebrow" id="modalGroup">Workout</p>
        <h2 id="modalTitle">Workout</h2>
        <p class="modal-description" id="modalDescription"></p>
        <div class="meta-row modal-meta" id="modalMeta"></div>
        <div class="demo-video" id="modalDemo" aria-label="In app exercise demo"></div>
        <div class="guide-box modal-guide">
          <strong>How to do it</strong>
          <ol id="modalGuide"></ol>
        </div>
      </div>
    </div>

    <script src="app.js?v=21" defer></script>
  </body>
</html>
